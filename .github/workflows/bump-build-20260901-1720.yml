name: Bump Hub Build 20260901.1720

on:
  push:
    paths:
      - ".github/workflows/bump-build-20260901-1720.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump build
        run: python tools/bump_build_20260901_1720.py
      - name: Commit build bump
        shell: bash
        run: |
          git config user.name "smartport-ui-bot"
          git config user.email "smartport-ui-bot@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Bump Hub build to 20260901.1720 [skip ci]"
          git push
