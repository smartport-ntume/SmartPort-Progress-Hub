name: Fix Guest PBKDF2 limit

on:
  push:
    paths:
      - ".github/workflows/fix-guest-pbkdf2-limit.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Worker PBKDF2 limit
        run: python tools/fix_guest_pbkdf2_limit.py
      - name: Commit Worker fix
        shell: bash
        run: |
          if git diff --quiet -- worker/src/public.js; then
            echo "No Worker changes required."
            exit 0
          fi
          git config user.name "smartport-schedule-bot"
          git config user.email "smartport-schedule-bot@users.noreply.github.com"
          git add worker/src/public.js
          git commit -m "Fix Guest PBKDF2 iterations for Cloudflare Workers [skip ci]"
          git push
