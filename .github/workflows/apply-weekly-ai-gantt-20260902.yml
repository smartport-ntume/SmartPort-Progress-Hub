name: Apply Weekly AI and Gantt 2026-09-02

on:
  push:
    paths:
      - ".github/workflows/apply-weekly-ai-gantt-20260902.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Weekly AI and Gantt changes
        run: python tools/apply_weekly_ai_gantt_20260902.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "smartport-ui-bot"
          git config user.email "smartport-ui-bot@users.noreply.github.com"
          git add worker/src/index.js worker/wrangler.toml js/app.js css/app.css index.html README.md
          git commit -m "Add AI weekly report intake and progress-fill Gantt [skip ci]"
          git push
