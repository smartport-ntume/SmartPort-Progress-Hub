name: Apply traceability UI 2026-09-02

on:
  push:
    paths:
      - ".github/workflows/apply-traceability-ui-20260902.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply traceability UI
        run: python tools/apply_traceability_ui_20260902.py
      - name: Commit traceability UI
        shell: bash
        run: |
          if git diff --quiet -- js/traceability.js js/plan-enhancements.js js/checkpoint-save.js index.html README.md; then
            echo "No traceability UI changes required."
            exit 0
          fi
          git config user.name "smartport-ui-bot"
          git config user.email "smartport-ui-bot@users.noreply.github.com"
          git add js/traceability.js js/plan-enhancements.js js/checkpoint-save.js index.html README.md
          git commit -m "Add interactive project traceability UI [skip ci]"
          git push
